<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#34a853;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Background circle -->
    <circle cx="16" cy="16" r="15" fill="url(#faviconGradient)"/>
    
    <!-- Database icon simplified for small size -->
    <ellipse cx="16" cy="10" rx="8" ry="3" fill="white"/>
    <rect x="8" y="10" width="16" height="8" fill="white"/>
    <ellipse cx="16" cy="18" rx="8" ry="3" fill="white"/>
    
    <!-- AI indicator dots -->
    <circle cx="12" cy="14" r="1" fill="url(#faviconGradient)"/>
    <circle cx="20" cy="14" r="1" fill="url(#faviconGradient)"/>
    <circle cx="16" cy="16" r="1" fill="url(#faviconGradient)"/>
    
    <!-- Text -->
    <text x="16" y="26" text-anchor="middle" fill="white" font-size="6" font-family="Arial, sans-serif" font-weight="bold">AI</text>
</svg>